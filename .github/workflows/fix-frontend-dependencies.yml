name: Fix frontend dependencies

on:
  push:
    branches: [fix/production-audit]

permissions:
  contents: write

jobs:
  audit-fix:
    if: "!contains(github.event.head_commit.message, '[deps fixed]')"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: fix/production-audit
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm install
      - name: Apply non-breaking security updates
        run: npm audit fix || true
      - name: Commit updated dependency manifests
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(deps): remediate frontend npm advisories [deps fixed]"
            git push origin HEAD:fix/production-audit
          fi
